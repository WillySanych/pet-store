server:
  port: 8081

spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:petstore}
    username: ${DB_USER:petstore}
    password: ${DB_PASSWORD:petstore}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: catalog
    contexts: ${LIQUIBASE_CONTEXTS:default}

grpc:
  server:
    port: 9101
