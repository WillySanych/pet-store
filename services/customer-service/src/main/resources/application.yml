server:
  port: 8083

spring:
  application:
    name: customer-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:petstore}
    username: ${DB_USER:petstore}
    password: ${DB_PASSWORD:petstore}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: customer
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: customer
    contexts: ${LIQUIBASE_CONTEXTS:default}
