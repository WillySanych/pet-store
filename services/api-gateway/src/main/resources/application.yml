server:
  port: 8080

spring:
  application:
    name: api-gateway
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      cache:
        time-to-live: 5s
  metrics:
    tags:
      service: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

petstore:
  metrics:
    exclude-prefix: /actuator
  gateway:
    services:
      catalog: ${CATALOG_URL:http://localhost:8081}
      inventory: ${INVENTORY_URL:http://localhost:8082}
      customer: ${CUSTOMER_URL:http://localhost:8083}
      order: ${ORDER_URL:http://localhost:8084}
    rate-limit:
      limit-for-period: ${GATEWAY_RATE_LIMIT:500}
