replicaCount: 1

image:
  repository: petstore/catalog-service
  pullPolicy: IfNotPresent

ports:
  - name: http
    port: 8081
  - name: grpc
    port: 9101

service:
  type: ClusterIP

database:
  enabled: true
  secretName: petstore-db

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

env:
  JAVA_OPTS: "-Xmx512m"
  DB_HOST: postgres
  DB_PORT: "5432"
  LIQUIBASE_CONTEXTS: default
