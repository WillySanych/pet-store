name: petstore

services:

  postgres:
    image: postgres:16.14
    container_name: petstore-postgres
    environment:
      POSTGRES_DB: petstore
      POSTGRES_USER: petstore
      POSTGRES_PASSWORD: petstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petstore -d petstore -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Initialization runs with TCP closed, so those probes would count as failures: without
      # this window the budget is only 50 seconds, and growing init scripts mark it unhealthy.
      start_period: 30s
    networks: [petstore]

  kafka:
    image: apache/kafka:4.3.1
    container_name: petstore-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      # Every run boots a JVM and takes about two seconds, hence the sparse interval: failures
      # are caught by start_period and retries, frequent polling at rest buys nothing.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [petstore]

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: petstore-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [petstore]

  grafana:
    image: grafana/grafana:13.0.6
    container_name: petstore-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [petstore]

  catalog-service:
    restart: unless-stopped
    networks: [petstore]
    image: petstore/catalog-service:0.1.0
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: catalog-service
    container_name: petstore-catalog-service
    environment:
      JAVA_OPTS: ${JAVA_OPTS:-}
      DB_HOST: postgres
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-default}
    ports:
      - "8081:8081"
      - "9101:9101"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health/readiness"]

  inventory-service:
    restart: unless-stopped
    networks: [petstore]
    image: petstore/inventory-service:0.1.0
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: inventory-service
    container_name: petstore-inventory-service
    environment:
      JAVA_OPTS: ${JAVA_OPTS:-}
      DB_HOST: postgres
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-default}
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8082:8082"
      - "9102:9102"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health/readiness"]

  customer-service:
    restart: unless-stopped
    networks: [petstore]
    image: petstore/customer-service:0.1.0
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: customer-service
    container_name: petstore-customer-service
    environment:
      JAVA_OPTS: ${JAVA_OPTS:-}
      DB_HOST: postgres
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-default}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health/readiness"]

  order-service:
    restart: unless-stopped
    networks: [petstore]
    image: petstore/order-service:0.1.0
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    container_name: petstore-order-service
    environment:
      JAVA_OPTS: ${JAVA_OPTS:-}
      DB_HOST: postgres
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-default}
      KAFKA_BOOTSTRAP: kafka:9092
      CATALOG_GRPC: static://catalog-service:9101
      INVENTORY_GRPC: static://inventory-service:9102
      CUSTOMER_URL: http://customer-service:8083
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8084/actuator/health/readiness"]

  api-gateway:
    restart: unless-stopped
    networks: [petstore]
    image: petstore/api-gateway:0.1.0
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    container_name: petstore-api-gateway
    environment:
      JAVA_OPTS: ${JAVA_OPTS:-}
      CATALOG_URL: http://catalog-service:8081
      INVENTORY_URL: http://inventory-service:8082
      CUSTOMER_URL: http://customer-service:8083
      ORDER_URL: http://order-service:8084
    ports:
      - "8080:8080"
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]

volumes:
  pgdata:
  kafkadata:
  promdata:
  grafanadata:

networks:
  petstore:
    driver: bridge
